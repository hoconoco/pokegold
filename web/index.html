<!DOCTYPE html>
<!-- mod: first screen — the chosen ROM's own title screen, running live (play.html?preview=1 in a frame:
     intro fast-forwarded and skipped, no sound, no save). ◀ ▶ (or arrow keys / swipe) switch between the
     four ROMs; tapping the screen, Enter, Space or the start button opens the real game (play.html). -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>포켓몬스터 골드·실버</title>
  <script>
    // old links (/?ver=silver, /?lang=en) go straight to the game
    if (/[?&](ver|lang)=/.test(location.search)) location.replace('play.html' + location.search);
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000;
      color: #f0f0f0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 10:9 Game Boy screen, as large as fits above the selector */
    #screen {
      position: relative;
      width: min(100vw, calc((100dvh - 96px) * 10 / 9));
      aspect-ratio: 10 / 9;
      background: #000;
      cursor: pointer;
    }
    #screen iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
      pointer-events: none;
    }
    /* black cover while the intro is skipped */
    #cover {
      position: absolute; inset: 0;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.35s ease;
      color: #777; font-size: 14px; letter-spacing: 0.3em;
    }
    #cover.off { opacity: 0; pointer-events: none; }
    #fade { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in; }
    #fade.on { opacity: 1; }

    #bar {
      height: 96px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #bar button {
      font: inherit;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .arrow {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #2a2d31;
      color: #ddd;
      font-size: 18px;
    }
    .arrow:hover { background: #3a3e44; }
    #name {
      min-width: 9.5em;
      text-align: center;
      font-weight: 700;
      font-size: 17px;
    }
    #name small { display: block; font-weight: 400; font-size: 12px; color: #999; margin-top: 2px; }
    #start {
      padding: 10px 18px;
      border-radius: 22px;
      background: #c9a227;
      color: #1a1a1a;
      font-weight: 700;
      font-size: 15px;
    }
    #start.silver { background: #b9bec5; }
    #start:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div id="screen" title="눌러서 시작">
    <iframe id="preview" title="시작 화면" tabindex="-1"></iframe>
    <div id="cover">· · ·</div>
    <div id="fade"></div>
  </div>
  <div id="bar">
    <button class="arrow" id="prev" aria-label="이전 판">◀</button>
    <div id="name"></div>
    <button class="arrow" id="next" aria-label="다음 판">▶</button>
    <button id="start">시작</button>
  </div>

  <script>
    const GAMES = [
      { q: '',                      name: '골드',   sub: '한국어판', silver: false },
      { q: 'ver=silver',            name: '실버',   sub: '한국어판', silver: true },
      { q: 'lang=en',               name: 'GOLD',   sub: 'English',  silver: false },
      { q: 'lang=en&ver=silver',    name: 'SILVER', sub: 'English',  silver: true },
    ];
    let idx = 0;
    try { idx = Math.min(GAMES.length - 1, Math.max(0, +localStorage.getItem('shelf_idx') || 0)); } catch (e) {}

    const frame = document.getElementById('preview');
    const cover = document.getElementById('cover');
    let coverTimer = 0;
    let going = false;

    function show() {
      const g = GAMES[idx];
      document.getElementById('name').innerHTML = `${g.name}<small>${g.sub}</small>`;
      document.getElementById('start').classList.toggle('silver', g.silver);
      cover.classList.remove('off');
      frame.src = 'play.html?preview=1' + (g.q ? '&' + g.q : '');
      clearTimeout(coverTimer);
      coverTimer = setTimeout(() => cover.classList.add('off'), 8000);  // fallback if no message
      try { localStorage.setItem('shelf_idx', String(idx)); } catch (e) {}
    }
    // the frame says when it reached the title screen
    addEventListener('message', (e) => {
      if (e.source === frame.contentWindow && e.data && e.data.previewTitle) {
        clearTimeout(coverTimer);
        setTimeout(() => cover.classList.add('off'), 250);
      }
    });
    function step(d) { idx = (idx + d + GAMES.length) % GAMES.length; show(); }
    function go() {
      if (going) return;
      going = true;
      document.getElementById('fade').classList.add('on');
      const g = GAMES[idx];
      setTimeout(() => { location.href = 'play.html' + (g.q ? '?' + g.q : ''); }, 420);
    }

    document.getElementById('prev').addEventListener('click', () => step(-1));
    document.getElementById('next').addEventListener('click', () => step(1));
    document.getElementById('start').addEventListener('click', go);
    document.getElementById('screen').addEventListener('click', go);
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
      else if (e.key === 'Enter' || e.key === ' ') { go(); e.preventDefault(); }
    });
    // swipe on phones
    let sx = null;
    addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    addEventListener('touchend', (e) => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx;
      sx = null;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    });
    // back button: undo the fade
    addEventListener('pageshow', () => { going = false; document.getElementById('fade').classList.remove('on'); });

    show();
  </script>
</body>
</html>
