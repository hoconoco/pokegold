<!DOCTYPE html>
<!-- mod: first screen — the eight Korean mod builds in release order, one at a time.
     Every slide shows its game's title screen (title/<id>.png) and the middle one plays the music of
     that title screen (title/<id>.m4a, looped) — both cut from the ROMs by tools/make_titles.py, so no
     emulator runs here; a game whose files are missing shows its name and stays silent.
     Swipe, arrow keys or tapping a side slide turns the carousel; tapping the middle asks
     'OO 버전을 시작하시겠습니까?' and 예 opens play.html?game=<id>.
     Sound: browsers allow it only after the first touch or key, so a small hint shows until then. -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>포켓몬스터</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 38%, #222831 0%, #0b0d10 72%) fixed, #0b0d10;
      color: #ece8df;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    #car { position: fixed; inset: 0; --cw: min(74vw, 520px); --step: calc(var(--cw) * 0.8); }
    .slide {
      position: absolute; left: 50%; top: 42%;
      width: var(--cw);
      aspect-ratio: var(--ar);
      transform: translate(-50%, -50%) translateX(calc(var(--off) * var(--step))) scale(var(--sc));
      transition: transform 0.45s cubic-bezier(.2,.8,.2,1), filter 0.45s ease, opacity 0.45s ease;
      filter: blur(var(--blur)) brightness(var(--dim));
      opacity: var(--op);
      background: #000;
      border-radius: 4px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.6);
      overflow: hidden;
      cursor: pointer;
    }
    .slide img { position: relative; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .slide .blank {
      position: absolute; inset: 0; display: grid; place-items: center;
      font: 700 22px "Malgun Gothic", sans-serif; color: rgba(255,255,255,0.55);
      background: linear-gradient(160deg, #2a3038, #15181d);
    }
    #cap {
      position: fixed; left: 0; right: 0; top: calc(42% + var(--half) + 22px);
      text-align: center; display: grid; gap: 4px;
    }
    /* the title screen already names the game; only the mod version goes under it */
    #cap .meta { font: 600 15px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; letter-spacing: 0.06em; color: #9aa3ad; }
    #dots { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; justify-content: center; gap: 7px; }
    #dots i { width: 6px; height: 6px; border-radius: 50%; background: #3b424c; }
    #dots i.on { background: #ece8df; }
    #hint {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #8f98a3; background: rgba(0,0,0,0.35); border: 1px solid #2d333c;
      padding: 4px 12px; border-radius: 999px; transition: opacity 0.4s;
    }
    #hint.off { opacity: 0; }
    /* confirm, in the games' own text-box style */
    #scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: grid; place-items: center; z-index: 5; }
    #scrim[hidden] { display: none; }
    .dialog {
      width: min(88vw, 440px);
      background: #f8f8f0; color: #181818;
      border: 6px double #181818; border-radius: 6px;
      box-shadow: 0 0 0 4px #f8f8f0, 0 14px 0 4px rgba(0,0,0,0.35);
      padding: 18px 20px 14px;
      font: 700 17px/1.55 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .dialog .opts { display: flex; justify-content: flex-end; gap: 22px; margin-top: 14px; }
    .dialog button {
      font: 700 17px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #181818;
      background: none; border: 0; padding: 4px 4px 4px 20px; position: relative; touch-action: manipulation;
    }
    .dialog button.sel::before { content: "▶"; position: absolute; left: 0; top: 7px; font-size: 12px; }
    #white { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in; z-index: 9; }
    #white.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="car"></div>
  <div id="cap"><div class="meta" id="meta"></div></div>
  <div id="dots"></div>
  <div id="hint">♪ 화면을 누르면 음악</div>
  <div id="scrim" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ask">
      <div id="ask"></div>
      <div class="opts"><button id="yes" class="sel">예</button><button id="no">아니오</button></div>
    </div>
  </div>
  <div id="white"></div>

  <script>
    // release order; ar = screen aspect (Game Boy Color 10:9, Advance 3:2)
    const GAMES = [
      { id: 'yellow',    name: '옐로',       meta: 'v0.8.1',  ar: '3 / 2' },
      { id: 'gold',      name: '골드',       meta: 'v2.0.0',  ar: '10 / 9' },
      { id: 'silver',    name: '실버',       meta: 'v2.0.0',  ar: '10 / 9' },
      { id: 'ruby',      name: '루비',       meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'sapphire',  name: '사파이어',   meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'firered',   name: '파이어레드', meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'leafgreen', name: '리프그린',   meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'emerald',   name: '에메랄드',   meta: 'v2.2.0',  ar: '3 / 2' },
    ];
    const $ = (s) => document.querySelector(s);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };
    // start on the game picked last time, else the first one
    let cur = Math.max(0, GAMES.findIndex((g) => g.id === store.get('shelf_game')));
    let soundOn = false;

    // slides: the title screen over the game's name (the name shows when the picture is missing)
    const car = $('#car');
    const slides = GAMES.map((g, i) => {
      const el = document.createElement('div');
      el.className = 'slide';
      el.style.setProperty('--ar', g.ar);
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `포켓몬스터 ${g.name}`);
      el.innerHTML = `<div class="blank">${g.name}</div><img src="title/${g.id}.png" alt="">`;
      el.querySelector('img').addEventListener('error', (e) => e.target.remove());
      el.addEventListener('click', () => {
        const d = rel(i);
        if (d === 0) ask(); else go(d);
      });
      car.appendChild(el);
      return el;
    });
    GAMES.forEach(() => $('#dots').appendChild(document.createElement('i')));

    // the middle game's title music, looped from its start each time the game comes to the middle;
    // one element for all, so a phone that let it play once keeps letting it
    const bgm = new Audio();
    bgm.loop = true;
    bgm.preload = 'auto';
    let bgmId = null;
    function music() {
      if (!soundOn || document.hidden || $('#white').classList.contains('on')) { bgm.pause(); return; }
      const id = GAMES[cur].id;
      if (bgmId !== id) { bgmId = id; bgm.src = `title/${id}.m4a`; }
      bgm.volume = 1;
      bgm.play().catch(() => {});
    }
    document.addEventListener('visibilitychange', music);

    function rel(i) {
      const n = GAMES.length;
      let d = (i - cur + n) % n;
      if (d > n / 2) d -= n;
      return d;
    }
    function layout() {
      slides.forEach((el, i) => {
        const d = rel(i);
        const near = Math.abs(d) <= 1;
        el.style.setProperty('--off', d);
        el.style.setProperty('--sc', d === 0 ? 1 : 0.7);
        el.style.setProperty('--blur', d === 0 ? '0px' : '3px');
        el.style.setProperty('--dim', d === 0 ? 1 : 0.6);
        el.style.setProperty('--op', near ? 1 : 0);
        el.style.zIndex = d === 0 ? 2 : 1;
        el.style.pointerEvents = near ? '' : 'none';
      });
      const g = GAMES[cur];
      $('#meta').textContent = g.meta;
      document.documentElement.style.setProperty('--half', `${slides[cur].offsetHeight / 2}px`);
      [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
      store.set('shelf_game', g.id);
      music();
    }
    function go(d) { cur = (cur + d + GAMES.length) % GAMES.length; layout(); }

    // first touch or key: sound on (browser rule); a touch also restarts music a phone paused
    function unlock() {
      if (!soundOn) { soundOn = true; $('#hint').classList.add('off'); }
      if (bgm.paused) music();
    }
    addEventListener('pointerdown', unlock, { capture: true });
    addEventListener('keydown', unlock, { capture: true });

    // swipe
    let sx = null, sy = null;
    addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; });
    addEventListener('pointerup', (e) => {
      if (sx === null || !$('#scrim').hidden) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        go(dx < 0 ? 1 : -1);
        suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
      }
    });
    let suppressClick = false;
    addEventListener('click', (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);

    // confirm
    let sel = 'yes';
    function setSel(s) { sel = s; $('#yes').classList.toggle('sel', s === 'yes'); $('#no').classList.toggle('sel', s === 'no'); }
    function ask() {
      $('#ask').textContent = `포켓몬스터 ${GAMES[cur].name} 버전을 시작하시겠습니까?`;
      $('#scrim').hidden = false; setSel('yes');
    }
    function close() { $('#scrim').hidden = true; }
    function start() {
      close();
      $('#white').classList.add('on');
      // the music fades with the white (phones that fix the volume just stop it at the end)
      const fade = setInterval(() => {
        bgm.volume = Math.max(0, bgm.volume - 0.1);
        if (bgm.volume === 0) { clearInterval(fade); bgm.pause(); }
      }, 40);
      setTimeout(() => { clearInterval(fade); bgm.pause(); location.href = `play.html?game=${GAMES[cur].id}`; }, 420);
    }
    $('#yes').addEventListener('click', start);
    $('#no').addEventListener('click', close);
    $('#yes').addEventListener('pointerenter', () => setSel('yes'));
    $('#no').addEventListener('pointerenter', () => setSel('no'));
    $('#scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') close(); });
    addEventListener('keydown', (e) => {
      if (!$('#scrim').hidden) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { setSel(sel === 'yes' ? 'no' : 'yes'); e.preventDefault(); }
        else if (e.key === 'Enter' || e.key === ' ') { (sel === 'yes' ? start : close)(); e.preventDefault(); }
        else if (e.key === 'Escape') close();
        return;
      }
      if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'ArrowRight') go(1);
      else if (e.key === 'Enter' || e.key === ' ') { ask(); e.preventDefault(); }
    });
    // back button: undo the white fade and play the middle game's music again
    addEventListener('pageshow', () => { $('#white').classList.remove('on'); music(); });

    layout();
    addEventListener('resize', layout);
  </script>
</body>
</html>
