<!DOCTYPE html>
<!-- mod: first screen — the eight Korean mod builds in release order, one at a time.
     Every slide shows its game's title screen (title/<id>.png) and the middle one plays the music of
     that title screen (title/<id>.m4a, looped) — both cut from the ROMs by tools/make_titles.py, so no
     emulator runs here; a game whose files are missing shows its name and stays silent.
     Swipe, arrow keys or tapping a side slide turns the carousel; tapping the middle asks
     'OO 버전을 시작하시겠습니까?' and 예 opens play.html?game=<id>.
     Sound: browsers allow it only after the first touch or key, so a small hint shows until then. -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>포켓몬스터</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 38%, #222831 0%, #0b0d10 72%) fixed, #0b0d10;
      color: #ece8df;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    #car { position: fixed; inset: 0; --cw: min(74vw, 520px); --step: calc(var(--cw) * 0.8); }
    .slide {
      position: absolute; left: 50%; top: 42%;
      width: var(--cw);
      aspect-ratio: var(--ar);
      transform: translate(-50%, -50%) translateX(calc(var(--off) * var(--step))) scale(var(--sc));
      transition: transform 0.45s cubic-bezier(.2,.8,.2,1), filter 0.45s ease, opacity 0.45s ease;
      filter: blur(var(--blur)) brightness(var(--dim));
      opacity: var(--op);
      background: #000;
      border-radius: 4px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.6);
      overflow: hidden;
      cursor: pointer;
    }
    .slide.tall { width: min(var(--cw), calc(64vh * 2 / 3)); }   /* DS two screens: fit the height too */
    .slide img { position: relative; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .slide .blank {
      position: absolute; inset: 0; display: grid; place-items: center;
      font: 700 22px "Malgun Gothic", sans-serif; color: rgba(255,255,255,0.55);
      background: linear-gradient(160deg, #2a3038, #15181d);
    }
    #cap {
      position: fixed; left: 0; right: 0; top: calc(42% + var(--half) + 22px);
      text-align: center; display: grid; gap: 4px;
    }
    /* the title screen already names the game; only the mod version goes under it */
    #cap .meta { font: 600 15px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; letter-spacing: 0.06em; color: #9aa3ad; }
    #dots { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; justify-content: center; gap: 7px; }
    #dots i { width: 6px; height: 6px; border-radius: 50%; background: #3b424c; }
    #dots i.on { background: #ece8df; }
    #hint {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #8f98a3; background: rgba(0,0,0,0.35); border: 1px solid #2d333c;
      padding: 4px 12px; border-radius: 999px; transition: opacity 0.4s;
    }
    #hint.off { opacity: 0; }
    /* confirm, in the games' own text-box style */
    #scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: grid; place-items: center; z-index: 5; }
    #scrim[hidden] { display: none; }
    .dialog {
      width: min(88vw, 440px);
      background: #f8f8f0; color: #181818;
      border: 6px double #181818; border-radius: 6px;
      box-shadow: 0 0 0 4px #f8f8f0, 0 14px 0 4px rgba(0,0,0,0.35);
      padding: 18px 20px 14px;
      font: 700 17px/1.55 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .dialog .opts { display: flex; justify-content: flex-end; gap: 22px; margin-top: 14px; }
    .dialog button {
      font: 700 17px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #181818;
      background: none; border: 0; padding: 4px 4px 4px 20px; position: relative; touch-action: manipulation;
    }
    .dialog button.sel::before { content: "▶"; position: absolute; left: 0; top: 7px; font-size: 12px; }
    #white { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in; z-index: 9; }
    #white.on { opacity: 1; }
    /* app: new version notice (only inside the Android app, when app/version.json is newer than the installed app) — a wide card above the dots */
    #upd { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 50; margin: 0 auto; max-width: 440px;
           display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; border-radius: 16px;
           background: rgba(28,31,38,.94); border: 1px solid rgba(255,255,255,.08); color: #fff; font-family: system-ui, sans-serif;
           box-shadow: 0 10px 30px rgba(0,0,0,.5); backdrop-filter: blur(8px); }
    #upd[hidden] { display: none; }
    #upd .txt { flex: 1; min-width: 0; }
    #upd .t1 { font: 700 15px/1.3 system-ui, sans-serif; }
    #upd .t2 { margin-top: 2px; font: 13px/1.35 system-ui, sans-serif; color: #a9afbb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #upd button { flex: none; font: 700 14px system-ui, sans-serif; padding: 9px 16px; border-radius: 999px; border: 0; background: #f2c14e; color: #1a1405; }
    #upd .x { background: transparent; color: #8a909c; padding: 6px; font-size: 18px; }
    /* app: getting a DS game ready (download, save) and what went wrong — drawn here so it looks like the rest */
    #busy { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8,9,12,.72); backdrop-filter: blur(6px); }
    #busy[hidden] { display: none; }
    #busy .card { width: min(84vw, 360px); padding: 22px 22px 18px; border-radius: 20px; background: #1c1f26; border: 1px solid rgba(255,255,255,.08);
                  color: #fff; font-family: system-ui, sans-serif; box-shadow: 0 16px 40px rgba(0,0,0,.55); text-align: center; }
    #busy img { width: 100%; border-radius: 10px; image-rendering: pixelated; margin-bottom: 14px; }
    #busy .b1 { font: 700 18px/1.3 system-ui, sans-serif; }
    #busy .b2 { margin-top: 6px; font: 14px/1.45 system-ui, sans-serif; color: #a9afbb; min-height: 20px; }
    #busy .bar { margin-top: 14px; height: 8px; border-radius: 99px; background: #2c313b; overflow: hidden; }
    #busy .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #f2c14e, #ffdf8a); transition: width .2s; }
    #busy .bar.spin i { width: 35%; animation: busyspin 1.1s ease-in-out infinite; }
    @keyframes busyspin { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
    #busy button { margin-top: 16px; font: 700 15px system-ui, sans-serif; padding: 10px 28px; border-radius: 999px; border: 0; background: #f2c14e; color: #1a1405; }
    #busy button[hidden], #busy .bar[hidden] { display: none; }
    #busy .btns { display: flex; gap: 10px; justify-content: center; }
    #busy button.ghost { background: #2c313b; color: #e6e8ec; }
    #busy .warn { color: #f2c14e; }
  </style>
</head>
<body>
  <div id="car"></div>
  <div id="cap"><div class="meta" id="meta"></div></div>
  <div id="dots"></div>
  <div id="hint">♪ 화면을 누르면 음악</div>
  <div id="scrim" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ask">
      <div id="ask"></div>
      <div class="opts"><button id="yes" class="sel">예</button><button id="no">아니오</button></div>
    </div>
  </div>
  <div id="white"></div>
  <div id="busy" hidden><div class="card"><img id="busyImg" alt=""><div class="b1" id="busyT"></div><div class="b2" id="busyS"></div>
    <div class="bar spin" id="busyBar"><i></i></div><div class="btns"><button id="busyNo" class="ghost" type="button" hidden>취소</button><button id="busyOk" type="button" hidden>확인</button></div></div></div>
  <div id="upd" hidden><div class="txt"><div class="t1" id="updText"></div><div class="t2" id="updNote"></div></div><button id="updGet" type="button">받기</button><button class="x" id="updX" type="button" aria-label="닫기">✕</button></div>
  <script>
    // Android app: it calls these while it gets a DS game ready (ratio 0..1, or -1 = not known yet) and when something went wrong
    window.appBusy = (game, title, text, ratio) => {
      const b = document.getElementById('busy');
      const img = document.getElementById('busyImg');
      img.style.display = game ? '' : 'none';
      if (game) { img.onerror = () => { img.style.display = 'none'; }; img.src = `title/${game}.png`; }
      document.getElementById('busyT').textContent = title;
      // lines: the app separates them with a line break (older apps: a comma before '처음 한 번만 받아요')
      const sEl = document.getElementById('busyS');
      sEl.innerHTML = '';
      String(text).replace(', 처음 한 번만 받아요', String.fromCharCode(10) + '처음 한 번만 받아요').split(String.fromCharCode(10))
        .forEach((line) => { const d = document.createElement('div'); d.textContent = line; sEl.appendChild(d); });
      const bar = document.getElementById('busyBar');
      bar.hidden = false; bar.classList.toggle('spin', !(ratio >= 0));
      bar.firstElementChild.style.width = ratio >= 0 ? `${Math.round(ratio * 100)}%` : '';
      document.getElementById('busyOk').hidden = true;
      document.getElementById('busyNo').hidden = true;
      b.hidden = false;
    };
    // before a big first download on mobile data: ask (the app goes on with PokeApp.romOk(game) or stops)
    window.appConfirm = (game, title, text, okLabel) => {
      window.appBusy(game, title, '', -1);
      const sEl = document.getElementById('busyS');
      sEl.innerHTML = '';
      text.split(String.fromCharCode(10)).forEach((line, i) => { const d = document.createElement('div'); d.textContent = line; if (i === 0) d.className = 'warn'; sEl.appendChild(d); });
      document.getElementById('busyBar').hidden = true;
      const ok = document.getElementById('busyOk'), no = document.getElementById('busyNo');
      ok.textContent = okLabel; ok.hidden = false; no.hidden = false;
      ok.onclick = () => { ok.textContent = '확인'; PokeApp.romOk(game); };
      no.onclick = () => { ok.textContent = '확인'; document.getElementById('busy').hidden = true; document.getElementById('white').classList.remove('on'); };
    };
    window.appBusyEnd = () => { document.getElementById('busy').hidden = true; };
    window.appError = (title, text) => {
      document.getElementById('busyT').textContent = title;
      document.getElementById('busyS').textContent = text;
      document.getElementById('busyBar').hidden = true;
      const ok = document.getElementById('busyOk');
      document.getElementById('busyNo').hidden = true;
      ok.textContent = '확인'; ok.hidden = false; ok.onclick = () => { document.getElementById('busy').hidden = true; document.getElementById('white').classList.remove('on'); };
      document.getElementById('busy').hidden = false;
    };
    // Android app: compare the installed app with app/version.json ({code, note}) and offer the new one
    (async () => {
      const A = window.PokeApp;
      if (!A || !A.appVersion) return;
      try {
        const v = await (await fetch('app/version.json', { cache: 'no-store' })).json();
        if (!(v.code > A.appVersion())) return;
        document.getElementById('updText').textContent = `새 버전이 나왔어요 (v${v.name || v.code})`;
        document.getElementById('updNote').textContent = v.note || '';
        document.getElementById('upd').hidden = false;
        document.getElementById('updGet').onclick = () => { A.update(); document.getElementById('updText').textContent = '받는 중…'; document.getElementById('updNote').textContent = '다 받으면 설치 화면이 떠요'; };
        document.getElementById('updX').onclick = () => { document.getElementById('upd').hidden = true; };
      } catch (e) {}
    })();
  </script>

  <script>
    // release order; ar = screen aspect (Game Boy Color 10:9, Advance 3:2, DS two screens 2:3)
    const GAMES = [
      { id: 'yellow',    name: '옐로',       meta: 'v0.9.2',  ar: '3 / 2' },
      { id: 'gold',      name: '골드',       meta: 'v2.1.0',  ar: '10 / 9' },
      { id: 'silver',    name: '실버',       meta: 'v2.1.0',  ar: '10 / 9' },
      { id: 'ruby',      name: '루비',       meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'sapphire',  name: '사파이어',   meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'firered',   name: '파이어레드', meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'leafgreen', name: '리프그린',   meta: 'v2.1.0',  ar: '3 / 2' },
      { id: 'emerald',   name: '에메랄드',   meta: 'v2.2.0',  ar: '3 / 2' },
      { id: 'diamond',   name: '디아루가',   meta: 'v0.1.10',  ar: '2 / 3' },
      { id: 'pearl',     name: '펄기아',     meta: 'v0.1.10',  ar: '2 / 3' },
      { id: 'platinum',  name: '기라티나',   meta: 'v0.1.11',  ar: '2 / 3' },
      { id: 'heartgold', name: '하트골드',   meta: 'v0.1.7',  ar: '2 / 3' },
      { id: 'soulsilver', name: '소울실버',  meta: 'v0.1.7',  ar: '2 / 3' },
      { id: 'black2',    name: '블랙2',      meta: 'v0.1.2',  ar: '2 / 3' },
      { id: 'white2',    name: '화이트2',    meta: 'v0.1.2',  ar: '2 / 3' },
    ];
    const $ = (s) => document.querySelector(s);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };
    // start on the game picked last time, else the first one
    let cur = Math.max(0, GAMES.findIndex((g) => g.id === store.get('shelf_game')));
    // Android app: its WebView may play without a touch — music from the start, like an app's own music
    let soundOn = !!window.PokeApp;
    if (soundOn) $('#hint').classList.add('off');

    // slides: the title screen over the game's name (the name shows when the picture is missing)
    const car = $('#car');
    const slides = GAMES.map((g, i) => {
      const el = document.createElement('div');
      el.className = 'slide';
      el.style.setProperty('--ar', g.ar);
      if (g.ar === '2 / 3') el.classList.add('tall');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `포켓몬스터 ${g.name}`);
      el.innerHTML = `<div class="blank">${g.name}</div><img src="title/${g.id}.png" alt="">`;
      el.querySelector('img').addEventListener('error', (e) => e.target.remove());
      el.addEventListener('click', () => {
        const d = rel(i);
        if (d === 0) ask(); else go(d);
      });
      car.appendChild(el);
      return el;
    });
    GAMES.forEach(() => $('#dots').appendChild(document.createElement('i')));

    // the middle game's title music, looped from its start each time the game comes to the middle;
    // one element for all, so a phone that let it play once keeps letting it
    const APP_BGM = 'firered';   // 판 선택 화면 음악(한 곡, 사용자 결정 파이어레드) — title/<이 이름>.m4a
    const bgm = new Audio();
    bgm.loop = true;
    bgm.preload = 'auto';
    let bgmId = null;
    // Android app: a DS game opens in the app's own screen and this page stays behind it (no page change) —
    // so the white is taken off again and the music waits until the page is touched again (사용자 신고 2026-11-17: 판 바꿀 때 흰 화면)
    // Android app: it calls these when this screen is covered (the DS game opened, home key) and shown again
    let appPaused = false;
    window.appPause = () => { appPaused = true; bgm.pause(); };
    window.appResume = () => { appPaused = false; music(); };
    function music() {
      if (!soundOn || document.hidden || appPaused || $('#white').classList.contains('on')) { bgm.pause(); return; }
      // one tune for the whole first screen, like an app's own music — it keeps playing across cards (사용자 2026-11-17)
      if (!bgmId) { bgmId = APP_BGM; bgm.src = `title/${APP_BGM}.m4a`; }
      bgm.volume = 1;
      bgm.play().catch(() => {});
    }
    document.addEventListener('visibilitychange', music);

    function rel(i) {
      const n = GAMES.length;
      let d = (i - cur + n) % n;
      if (d > n / 2) d -= n;
      return d;
    }
    function layout() {
      slides.forEach((el, i) => {
        const d = rel(i);
        const near = Math.abs(d) <= 1;
        el.style.setProperty('--off', d);
        el.style.setProperty('--sc', d === 0 ? 1 : 0.7);
        el.style.setProperty('--blur', d === 0 ? '0px' : '3px');
        el.style.setProperty('--dim', d === 0 ? 1 : 0.6);
        el.style.setProperty('--op', near ? 1 : 0);
        el.style.zIndex = d === 0 ? 2 : 1;
        el.style.pointerEvents = near ? '' : 'none';
      });
      const g = GAMES[cur];
      $('#meta').textContent = g.meta;
      document.documentElement.style.setProperty('--half', `${slides[cur].offsetHeight / 2}px`);
      [...$('#dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));
      store.set('shelf_game', g.id);
      music();
    }
    function go(d) { cur = (cur + d + GAMES.length) % GAMES.length; layout(); }

    // first touch or key: sound on (browser rule); a touch also restarts music a phone paused
    function unlock() {
      if (!soundOn) { soundOn = true; $('#hint').classList.add('off'); }
      if (bgm.paused) music();
    }
    addEventListener('pointerdown', unlock, { capture: true });
    addEventListener('keydown', unlock, { capture: true });

    // swipe
    let sx = null, sy = null;
    addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; });
    addEventListener('pointerup', (e) => {
      if (sx === null || !$('#scrim').hidden) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        go(dx < 0 ? 1 : -1);
        suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
      }
    });
    let suppressClick = false;
    addEventListener('click', (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);

    // confirm
    let sel = 'yes';
    function setSel(s) { sel = s; $('#yes').classList.toggle('sel', s === 'yes'); $('#no').classList.toggle('sel', s === 'no'); }
    function ask() {
      $('#ask').textContent = `포켓몬스터 ${GAMES[cur].name} 버전을 시작하시겠습니까?`;
      $('#scrim').hidden = false; setSel('yes');
    }
    function close() { $('#scrim').hidden = true; }
    function start() {
      close();
      // Android app, DS game: the app gets it ready (download card here) and opens its own screen — the music goes on
      // until then (사용자 2026-11-17: 플레이하기 전까지 대표 음악 유지), no white
      if (window.PokeApp && GAMES[cur].ar === '2 / 3') { location.href = `play.html?game=${GAMES[cur].id}`; return; }
      $('#white').classList.add('on');
      // the music fades with the white (phones that fix the volume just stop it at the end)
      const fade = setInterval(() => {
        bgm.volume = Math.max(0, bgm.volume - 0.1);
        if (bgm.volume === 0) { clearInterval(fade); bgm.pause(); }
      }, 40);
      setTimeout(() => { clearInterval(fade); bgm.pause(); location.href = `play.html?game=${GAMES[cur].id}`; }, 420);
    }
    $('#yes').addEventListener('click', start);
    $('#no').addEventListener('click', close);
    $('#yes').addEventListener('pointerenter', () => setSel('yes'));
    $('#no').addEventListener('pointerenter', () => setSel('no'));
    $('#scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') close(); });
    addEventListener('keydown', (e) => {
      if (!$('#scrim').hidden) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { setSel(sel === 'yes' ? 'no' : 'yes'); e.preventDefault(); }
        else if (e.key === 'Enter' || e.key === ' ') { (sel === 'yes' ? start : close)(); e.preventDefault(); }
        else if (e.key === 'Escape') close();
        return;
      }
      if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'ArrowRight') go(1);
      else if (e.key === 'Enter' || e.key === ' ') { ask(); e.preventDefault(); }
    });
    // back button: undo the white fade and play the middle game's music again
    addEventListener('pageshow', () => { $('#white').classList.remove('on'); music(); });

    layout();
    addEventListener('resize', layout);
  </script>
</body>
</html>
