<!DOCTYPE html>
<!-- mod: play screen on the mGBA web core (Game Boy, Color and Advance).
     play.html?game=<id>  — ids in GAMES below (Korean mod builds, roms/<id>.gba|gbc, copied in at deploy).
     The device frame is the owner's photo of the handheld (frames/<gbc|gba>.webp, not in git): the game
     picture covers the photo's screen, the photo's buttons are the touch targets, the photo's power lamp
     shows the save state. A game whose frame photo is missing gets the picture and plain buttons.
     Save: one server slot per game (api/save?slot=), uploaded about a second after the game writes it
     (Gold/Silver: only when the game data part changed — they write scratch to save RAM all the time);
     the browser's own copy (IndexedDB) is the fallback when the server cannot be reached.
     play.html?game=<id>&preview=1 — for the first screen: no frame, no save, sound off until the parent
     page turns it on, the intro is fast-forwarded and skipped to the title screen (PREVIEW_SKIP). -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>포켓몬스터</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
    body {
      color: #e8e6e1;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    #stage { position: fixed; inset: 0; }
    #dev { position: absolute; left: 50%; top: 50%; transform-origin: center; }
    #dev .part { position: absolute; }
    #photo { display: block; pointer-events: none; -webkit-user-drag: none; }
    #lit { background: #000; border-radius: 3px; }
    canvas#screen { display: block; width: 100%; height: 100%; image-rendering: pixelated; background: #000; }
    /* the photo's power lamp, used as the save lamp */
    #led { border-radius: 50%; opacity: 0; transition: background 0.2s, box-shadow 0.2s, opacity 0.2s; }
    #led.ok   { opacity: 1; background: #3ad06a; box-shadow: 0 0 10px 3px rgba(58,208,106,0.8); }
    #led.busy { opacity: 1; background: #f2a33a; box-shadow: 0 0 10px 3px rgba(242,163,58,0.85); }
    #led.fail { opacity: 1; background: #ff3b30; box-shadow: 0 0 10px 3px rgba(255,59,48,0.85); }
    /* touch targets over the photo's buttons; pressed = the button sinks a little */
    .hot { border: 0; padding: 0; background: transparent; border-radius: 8px; touch-action: none; }
    .hot.round { border-radius: 50%; }
    .hot.pill { border-radius: 999px; }
    .hot.on { background: rgba(0,0,0,0.28); box-shadow: inset 0 3px 6px rgba(0,0,0,0.45); }
    /* no frame photo: the buttons of the earlier web player (grey pad, magenta A/B, grey capsules) */
    .plain .hot {
      opacity: 0.8;
      background: radial-gradient(ellipse at center, #666 0%, #5c5c5c 80%);
      color: transparent;
      border-radius: 6px;
    }
    .plain .hot.round {
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #ab1465 0%, #8b1e57 100%);
      box-shadow: 0 6px 8px rgba(0,0,0,0.2);
      color: #440f1f; font: 700 48px sans-serif;
    }
    .plain .hot.pill {
      border-radius: 999px;
      background: radial-gradient(ellipse at center, #666 0%, #555 100%);
      box-shadow: 0 6px 8px rgba(0,0,0,0.2);
      color: #111; font: 700 16px sans-serif;
    }
    .plain .hot.on { opacity: 0.5; box-shadow: none; }
    /* Advance games: our own body in the game's color */
    .shellui .body {
      border-radius: 56px 56px 72px 72px;
      background:
        radial-gradient(ellipse 80% 40% at 30% 0%, rgba(255,255,255,0.28), transparent 70%),
        linear-gradient(180deg, var(--c1), var(--c2));
      box-shadow: inset 0 3px 2px rgba(255,255,255,0.35), inset 0 -10px 24px rgba(0,0,0,0.28), 0 30px 60px rgba(0,0,0,0.5);
    }
    .shellui .bezel {
      border-radius: 26px 26px 40px 40px;
      background: linear-gradient(180deg, #24272d, #17191d);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.08), 0 2px 0 rgba(255,255,255,0.25);
    }
    .shellui .etch { font: 700 20px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; letter-spacing: 0.14em; color: rgba(0,0,0,0.38); text-shadow: 0 1px 0 rgba(255,255,255,0.3); }
    .shellui #led { width: 12px; height: 12px; }
    .shellui .hot { transition: transform 0.05s, box-shadow 0.05s; }
    .shellui .shoulder {
      background: linear-gradient(180deg, color-mix(in srgb, var(--c2) 70%, #000), var(--c2));
      color: rgba(255,255,255,0.55); font: 800 22px/1 sans-serif;
      display: flex; align-items: flex-start; justify-content: center; padding-top: 6px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,0.18);
    }
    .shellui .arm, .shellui .padhub { background: #2a2c31; }
    .shellui .arm { box-shadow: 0 6px 0 #141518; }
    .shellui .padhub { border-radius: 4px; box-shadow: 0 6px 0 #141518; }
    .shellui .face {
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #4a4d55, #2a2c31 70%);
      box-shadow: 0 7px 0 #141518, 0 10px 14px rgba(0,0,0,0.3);
      color: rgba(255,255,255,0.28); font: 800 40px sans-serif;
    }
    .shellui .small { border-radius: 999px; background: #2a2c31; box-shadow: 0 4px 0 #141518; }
    .shellui .grille i { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: rgba(0,0,0,0.32); box-shadow: inset 0 2px 2px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.25); }
    .shellui .hot.on { transform: translateY(5px); box-shadow: 0 1px 0 #141518; background-color: transparent; }
    .shellui .shoulder.on { transform: translateY(6px); box-shadow: none; }
    /* top corner: game select and speed, small and quiet */
    #corner {
      position: fixed; z-index: 5;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
      display: flex; gap: 8px;
    }
    #corner button {
      font: 600 13px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: rgba(232,230,225,0.8);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 12px;
      touch-action: manipulation;
    }
    #corner button.fast { color: #1a1405; background: #f2c14e; border-color: #f2c14e; }
    #msg {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
      font-size: 12px; color: rgba(232,230,225,0.55); z-index: 5; white-space: nowrap;
    }
    #fadein { position: fixed; inset: 0; background: #fff; z-index: 9; pointer-events: none; transition: opacity 0.5s ease-out; }
    #fadein.off { opacity: 0; }
    /* the full-height body has its own game-select and speed keys */
    body.fullbody #corner { display: none; }
    /* preview: the picture only */
    body.preview #corner, body.preview #msg, body.preview #fadein { display: none; }
  </style>
</head>
<body>
  <div id="stage"><div id="dev"></div></div>
  <div id="corner">
    <button id="home" type="button">판 선택</button>
    <button id="speed" type="button" aria-label="게임 속도">×1</button>
  </div>
  <div id="msg"></div>
  <div id="fadein"></div>

  <script type="module">
    import mGBA from './mgba/mgba.js';

    // Korean Gold/Silver save RAM: banks 1-3 hold the game (an in-game save always rewrites bank 1),
    // and a real save has check value 99 at bank 1 $A008 (ValidateSave in both ROMs)
    const GB2_SAVE = { data: [0x2000, 0x8000], check: [0x2008, 99] };
    const GAMES = {
      yellow:    { name: '옐로',       rom: 'yellow.gba',    slot: 'yellow',    frame: 'gba', c1: '#f7d348', c2: '#d9a514' },
      gold:      { name: '골드',       rom: 'gold.gbc',      slot: 'kr',        frame: null, c1: '#e7c55a', c2: '#b38a1c', save: GB2_SAVE },
      silver:    { name: '실버',       rom: 'silver.gbc',    slot: 'kr_silver', frame: null, c1: '#dfe3e8', c2: '#9ea6af', save: GB2_SAVE },
      ruby:      { name: '루비',       rom: 'ruby.gba',      slot: 'ruby',      frame: 'gba', c1: '#d7404c', c2: '#8e1422' },
      sapphire:  { name: '사파이어',   rom: 'sapphire.gba',  slot: 'sapphire',  frame: 'gba', c1: '#3d6fcc', c2: '#183a85' },
      firered:   { name: '파이어레드', rom: 'firered.gba',   slot: 'firered',   frame: 'gba', c1: '#ee6a3f', c2: '#b8331c' },
      leafgreen: { name: '리프그린',   rom: 'leafgreen.gba', slot: 'leafgreen', frame: 'gba', c1: '#6cbb52', c2: '#367a2a' },
      emerald:   { name: '에메랄드',   rom: 'emerald.gba',   slot: 'emerald',   frame: 'gba', c1: '#2fc493', c2: '#0c7352' },
    };
    // Gold/Silver: the plain layout (picture and buttons) — the user preferred it to the photo frame.
    // Frame photos (owner's photos, cropped): image size, the photo's lit screen, where the game picture
    // goes (the game's own aspect), the power lamp, and the buttons. Coordinates are image pixels.
    const FRAMES = {
      gbc: { src: 'frames/gbc.webp', w: 720, h: 1040,
             clip: "path('M 96 6 L 592 6 Q 622 6 624 36 L 716 1040 L 4 1040 L 66 36 Q 68 6 96 6 Z')",
             lit: [154, 71, 390, 304], game: [182, 73, 334, 300], led: [110, 152, 22],
             hot: {
               Up: [132, 550, 56, 56], Down: [132, 658, 56, 56], Left: [78, 600, 57, 58], Right: [187, 600, 57, 58],
               B: [431, 604, 84, 84, 'round'], A: [549, 560, 84, 84, 'round'],
               Select: [268, 807, 70, 38, 'pill'], Start: [372, 807, 70, 38, 'pill'],
             } },
      gba: null,  // photo pending
    };
    // first screen: how to reach the title screen — press `button` after `frames` emulated frames
    const PREVIEW_SKIP = {
      yellow: { frames: 600, button: 'Start' }, gold: { frames: 720, button: 'Start' }, silver: { frames: 720, button: 'Start' },
      ruby: { frames: 600, button: 'Start' }, sapphire: { frames: 600, button: 'Start' },
      firered: { frames: 600, button: 'Start' }, leafgreen: { frames: 600, button: 'Start' }, emerald: { frames: 600, button: 'Start' },
    };
    const SPEEDS = [1, 2, 3];

    const q = new URLSearchParams(location.search);
    const id = GAMES[q.get('game')] ? q.get('game') : 'gold';
    const G = GAMES[id];
    const PREVIEW = q.get('preview') === '1';
    const $ = (s) => document.querySelector(s);
    document.title = `포켓몬스터 ${G.name}`;
    if (PREVIEW) document.body.classList.add('preview');

    const isGbc = G.rom.endsWith('.gbc');
    const [SW, SH] = isGbc ? [160, 144] : [240, 160];

    // ---------- layout ----------
    async function loadFrame() {
      const f = FRAMES[G.frame];
      if (PREVIEW || !f) return null;
      const ok = await new Promise((res) => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = f.src; });
      return ok ? f : null;
    }
    const box = (x, y, w, h) => `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
    function build(f) {
      const dev = $('#dev');
      let html = '';
      if (f) {
        dev.style.width = f.w + 'px'; dev.style.height = f.h + 'px';
        html += `<img id="photo" class="part" src="${f.src}" alt="" style="${box(0, 0, f.w, f.h)}clip-path:${f.clip}">`;
        html += `<div id="lit" class="part" style="${box(...f.lit)}"></div>`;
        html += `<div class="part" style="${box(...f.game)}"><canvas id="screen" width="${SW}" height="${SH}"></canvas></div>`;
        html += `<div id="led" class="part" style="${box(f.led[0] - f.led[2] / 2, f.led[1] - f.led[2] / 2, f.led[2], f.led[2])}"></div>`;
        for (const [k, v] of Object.entries(f.hot)) {
          html += `<button class="part hot ${v[4] || ''}" data-k="${k}" aria-label="${k}" style="${box(v[0], v[1], v[2], v[3])}"></button>`;
        }
      } else if (PREVIEW) {
        dev.style.width = SW * 4 + 'px'; dev.style.height = SH * 4 + 'px';
        html += `<div class="part" style="${box(0, 0, SW * 4, SH * 4)}"><canvas id="screen" width="${SW}" height="${SH}"></canvas></div>`;
      } else if (!isGbc) {
        shellLayout = innerWidth > innerHeight ? 'land' : 'port';
        html = shellHtml(shellLayout);
        dev.classList.add('shellui');
        document.body.classList.add('fullbody');
      } else {
        // plain: picture on top, buttons below (portrait phone first)
        const W = 720, gh = Math.round(W * SH / SW);
        dev.classList.add('plain');
        dev.style.width = W + 'px'; dev.style.height = gh + 560 + 'px';
        html += `<div class="part" style="${box(0, 0, W, gh)}"><canvas id="screen" width="${SW}" height="${SH}"></canvas></div>`;
        html += `<div id="led" class="part" style="${box(10, gh + 14, 14, 14)}"></div>`;
        const y = gh + 90;
        const pad = { Up: [110, y, 90, 90], Down: [110, y + 180, 90, 90], Left: [20, y + 90, 90, 90], Right: [200, y + 90, 90, 90],
                      B: [440, y + 110, 110, 110, 'round'], A: [580, y + 50, 110, 110, 'round'],
                      Select: [230, y + 340, 110, 44, 'pill'], Start: [380, y + 340, 110, 44, 'pill'] };
        const label = { Up: '▲', Down: '▼', Left: '◀', Right: '▶', A: 'A', B: 'B', Select: 'SELECT', Start: 'START' };
        for (const [k, v] of Object.entries(pad)) {
          html += `<button class="part hot ${v[4] || ''}" data-k="${k}" aria-label="${k}" style="${box(v[0], v[1], v[2], v[3])}">${label[k]}</button>`;
        }
      }
      dev.innerHTML = html;
      placeCanvas();
      fit();
    }

    // The game canvas is made once and moved between layouts, so turning the phone does not stop the game.
    let canvasEl = null;
    function placeCanvas() {
      const slot = $('#screenbox');
      if (!slot) return;   // layouts that write the canvas themselves
      if (!canvasEl) { canvasEl = document.createElement('canvas'); canvasEl.id = 'screen'; canvasEl.width = SW; canvasEl.height = SH; }
      slot.appendChild(canvasEl);
    }

    // Advance games without a photo: a body of our own in the game's color (no logos) — bezel with
    // the save lamp, shoulder L/R on the top corners, pad, A/B, START/SELECT, game-select and speed keys.
    // Portrait: the body fills the phone top to bottom, controls in the middle of the space under the
    // screen, game select and speed at the bottom. Landscape: the screen in the middle as large as the
    // height allows, pad and START/SELECT on the left, A/B and game select/speed on the right.
    let shellLayout = null;
    function shellHtml(kind) {
      const dev = $('#dev');
      dev.style.setProperty('--c1', G.c1); dev.style.setProperty('--c2', G.c2);
      let html = '';
      const pad = (cx, cy, a) => {
        let h = `<div class="part padhub" style="${box(cx - a / 2, cy - a / 2, a, a)}"></div>`;
        h += `<button class="part hot arm" data-k="Up" aria-label="위" style="${box(cx - a / 2, cy - a * 1.5, a, a + 4)}border-radius:12px 12px 0 0"></button>`;
        h += `<button class="part hot arm" data-k="Down" aria-label="아래" style="${box(cx - a / 2, cy + a / 2 - 4, a, a + 4)}border-radius:0 0 12px 12px"></button>`;
        h += `<button class="part hot arm" data-k="Left" aria-label="왼쪽" style="${box(cx - a * 1.5, cy - a / 2, a + 4, a)}border-radius:12px 0 0 12px"></button>`;
        h += `<button class="part hot arm" data-k="Right" aria-label="오른쪽" style="${box(cx + a / 2 - 4, cy - a / 2, a + 4, a)}border-radius:0 12px 12px 0"></button>`;
        return h;
      };
      const key = (attrs, x, y, label, lblId = '') =>
        `<button class="part ${attrs}" style="${box(x, y, 96, 32)}"></button>` +
        `<div class="part etch" ${lblId ? `id="${lblId}"` : ''} style="${box(x - 30, y + 40, 156, 22)}text-align:center">${label}</div>`;
      const speedText = `속도 ×${SPEEDS[speedIdx]}`;
      if (kind === 'land') {
        const H = 720, W = Math.max(1300, Math.round(H * innerWidth / innerHeight));
        let sw = Math.min(840, W - 600), sh = Math.round(sw * 2 / 3);
        const sx = Math.round((W - sw) / 2), sy = 70 + Math.round((560 - sh) / 2);
        const lx = sx / 2, rx = W - sx / 2;
        dev.style.width = W + 'px'; dev.style.height = H + 'px';
        html += `<button class="part hot shoulder" data-k="L" aria-label="L" style="${box(40, 0, 260, 70)}border-radius:40px 14px 0 0">L</button>`;
        html += `<button class="part hot shoulder" data-k="R" aria-label="R" style="${box(W - 300, 0, 260, 70)}border-radius:14px 40px 0 0">R</button>`;
        html += `<div class="part body" style="${box(0, 30, W, H - 30)}border-radius:48px 48px 0 0"></div>`;
        html += `<div class="part bezel" style="${box(sx - 14, sy - 20, sw + 28, sh + 48)}"></div>`;
        html += `<div class="part" id="screenbox" style="${box(sx, sy, sw, sh)}"></div>`;
        html += `<div id="led" class="part" style="${box(sx + 4, sy + sh + 9, 12, 12)}"></div>`;
        html += pad(lx, 290, 78);
        html += key('hot small" data-k="Start" aria-label="START', lx - 48, 470, 'START');
        html += key('hot small" data-k="Select" aria-label="SELECT', lx - 48, 570, 'SELECT');
        html += `<button class="part hot face" data-k="A" aria-label="A" style="${box(rx + 14, 190, 112, 112)}">A</button>`;
        html += `<button class="part hot face" data-k="B" aria-label="B" style="${box(rx - 126, 270, 112, 112)}">B</button>`;
        html += key('small" id="homeKey" aria-label="판 선택', rx - 48, 470, '판 선택');
        html += key('small" id="speedKey" aria-label="게임 속도', rx - 48, 570, speedText, 'speedLabel');
        return html;
      }
      const W = 720, sx = 26, sw = 668, sh = 445;
      const H = Math.max(1040, Math.round(W * innerHeight / innerWidth));
      const sy = 72 + Math.round(Math.max(0, H - 1040) * 0.15);
      const y0 = sy + sh + 84 + Math.round(Math.max(0, (H - 100) - (sy + sh + 84 + 420)) / 2);
      dev.style.width = W + 'px'; dev.style.height = H + 'px';
      html += `<button class="part hot shoulder" data-k="L" aria-label="L" style="${box(24, sy - 72, 230, 70)}border-radius:40px 14px 0 0">L</button>`;
      html += `<button class="part hot shoulder" data-k="R" aria-label="R" style="${box(W - 254, sy - 72, 230, 70)}border-radius:14px 40px 0 0">R</button>`;
      html += `<div class="part body" style="${box(0, sy - 42, W, H - sy + 42)}border-radius:56px 56px 0 0"></div>`;
      html += key('small" id="homeKey" aria-label="판 선택', W / 2 - 150, H - 88, '판 선택');
      html += key('small" id="speedKey" aria-label="게임 속도', W / 2 + 54, H - 88, speedText, 'speedLabel');
      html += `<div class="part bezel" style="${box(sx - 14, sy - 20, sw + 28, sh + 48)}"></div>`;
      html += `<div class="part" id="screenbox" style="${box(sx, sy, sw, sh)}"></div>`;
      html += `<div id="led" class="part" style="${box(sx + 4, sy + sh + 9, 12, 12)}"></div>`;
      html += pad(176, y0 + 150, 74);
      html += `<button class="part hot face" data-k="B" aria-label="B" style="${box(426, y0 + 168, 112, 112)}">B</button>`;
      html += `<button class="part hot face" data-k="A" aria-label="A" style="${box(568, y0 + 98, 112, 112)}">A</button>`;
      html += key('hot small" data-k="Start" aria-label="START', 84, y0 + 280, 'START');
      html += key('hot small" data-k="Select" aria-label="SELECT', 84, y0 + 352, 'SELECT');
      let dots = '';
      for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) dots += `<i style="left:${c * 22}px;top:${r * 22}px"></i>`;
      html += `<div class="part grille" style="${box(536, y0 + 320, 130, 86)}">${dots}</div>`;
      return html;
    }

    // turning the phone: re-lay the body (the canvas moves along), otherwise just re-fit
    addEventListener('resize', () => {
      const dev = $('#dev');
      if (dev.classList.contains('shellui')) {
        const kind = innerWidth > innerHeight ? 'land' : 'port';
        if (kind !== shellLayout) {
          shellLayout = kind;
          dev.innerHTML = shellHtml(kind);
          placeCanvas();
          if (M) bindPointers();
          lamp(lastLamp);
        }
      }
      fit();
    });
    function fit() {
      const dev = $('#dev');
      const w = parseFloat(dev.style.width), h = parseFloat(dev.style.height);
      const top = PREVIEW || dev.classList.contains('shellui') ? 0 : 44;   // room for the corner buttons
      const s = Math.min(innerWidth / w, (innerHeight - top) / h);
      dev.style.transform = `translate(-50%, calc(-50% + ${top / 2}px)) scale(${s})`;
    }

    // ---------- save ----------
    const SAVE_URL = `api/save?slot=${G.slot}`;
    let lastLamp = 'ok';
    function lamp(state, text) {
      lastLamp = state;
      const led = $('#led');
      if (led) { led.classList.remove('ok', 'busy', 'fail'); led.classList.add(state); }
      if (text !== undefined) $('#msg').textContent = text;
    }
    async function serverSave() {
      try {
        const r = await fetch(SAVE_URL, { cache: 'no-store' });
        if (r.ok) return new Uint8Array(await r.arrayBuffer());
        if (r.status === 404) return null;
      } catch (e) {}
      return undefined;  // unreachable
    }
    // Gold/Silver also use save RAM bank 0 as scratch (picture decompression, menu window stack), so it
    // changes whenever they run; an in-game save always writes banks 1-3 (G.save.data).
    // `sent` is the save the server has: a change outside G.save.data alone is not sent (no junk uploads
    // pushing real saves out of the server's 30 backups). With nothing to compare yet, the first one seen
    // becomes `sent` (the scratch written on the title screen, long before the game can be saved).
    // Starting a new game clears the active box count in bank 1 ($ADAE), so that goes up once.
    let sent = null;
    function sameGameData(a, b) {
      const [lo, hi] = G.save.data;
      if (!b || a.length < hi || b.length < hi) return false;
      for (let i = lo; i < hi; i++) if (a[i] !== b[i]) return false;
      return true;
    }
    async function upload(force) {
      const data = M.getSave();
      if (!data || !data.length) return;
      if (G.save && !force) {
        if (!sent) { sent = data.slice(); return; }
        if (sameGameData(data, sent)) return;
      }
      lamp('busy');
      try {
        const r = await fetch(SAVE_URL, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: data.slice() });
        if (r.ok) sent = data.slice();
        lamp(r.ok ? 'ok' : 'fail', r.ok ? '' : '서버 저장 실패 — 이 기기에만 저장됨');
      } catch (e) {
        lamp('fail', '서버에 연결 안 됨 — 이 기기에만 저장됨');
      }
      M.FSSync();
    }

    // ---------- input ----------
    function press(k, on) {
      const el = document.querySelector(`[data-k="${k}"]`);
      if (el) el.classList.toggle('on', on);
      on ? M.buttonPress(k) : M.buttonUnpress(k);
    }
    function bindPointers() {
      document.querySelectorAll('[data-k]').forEach((el) => {
        const k = el.dataset.k;
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {} press(k, true); });
        for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, () => press(k, false));
      });
    }
    function bindInput() {
      bindPointers();
      const KEYS = { ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
                     KeyX: 'A', KeyZ: 'B', Enter: 'Start', Tab: 'Select', KeyA: 'L', KeyS: 'R' };
      M.toggleInput(false);  // keyboard goes through the same path as touch
      addEventListener('keydown', (e) => {
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { if (!e.repeat) nextSpeed(); return; }
        const k = KEYS[e.code];
        if (!k) return;
        e.preventDefault();
        if (!e.repeat) press(k, true);
      });
      addEventListener('keyup', (e) => { const k = KEYS[e.code]; if (k) press(k, false); });
    }
    let speedIdx = 0;
    function nextSpeed() {
      speedIdx = (speedIdx + 1) % SPEEDS.length;
      M.setFastForwardMultiplier(SPEEDS[speedIdx]);
      const b = $('#speed');
      b.textContent = `×${SPEEDS[speedIdx]}`;
      b.classList.toggle('fast', SPEEDS[speedIdx] > 1);
      const lbl = $('#speedLabel');
      if (lbl) lbl.textContent = `속도 ×${SPEEDS[speedIdx]}`;
    }

    // sound needs a touch or key first (browser rule); the first screen calls these from its own touch
    let M = null;
    window.unlockAudio = () => { try { M && M.resumeAudio(); } catch (e) {} };
    window.setPreviewSound = (on) => { try { if (!M) return; M.setVolume(on ? 1 : 0); if (on) M.resumeAudio(); } catch (e) {} };
    for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => window.unlockAudio(), { capture: true });

    // ---------- start ----------
    (async () => {
      const f = await loadFrame();
      build(f);
      M = await mGBA({ canvas: $('#screen') });
      await M.FSInit();
      M.setCoreSettings({ autoSaveStateEnable: false, restoreAutoSaveStateOnLoad: false, rewindEnable: false });
      const paths = M.filePaths();
      const romPath = `${paths.gamePath}/${G.rom}`;
      const savePath = `${paths.savePath}/${G.rom.replace(/\.\w+$/, '')}.sav`;
      const rom = new Uint8Array(await (await fetch('roms/' + G.rom)).arrayBuffer());
      M.FS.writeFile(romPath, rom);

      if (PREVIEW) {
        M.setVolume(0);
        // a throwaway save path so the first screen never touches the real save
        M.loadGame(romPath, '/preview.sav');
        skipToTitle();
        return;
      }

      const srv = await serverSave();
      if (srv) {
        M.FS.writeFile(savePath, srv);
        lamp('ok');
      } else if (srv === null) {
        lamp('ok', '새 게임');
        setTimeout(() => lamp('ok', ''), 3000);
      } else {
        lamp('fail', '서버에 연결 안 됨 — 이 기기의 세이브로');
      }
      if (!M.loadGame(romPath)) { $('#msg').textContent = 'ROM을 불러오지 못했습니다'; return; }
      bindInput();
      // what the server has (offline: this device's copy, which is what it will be compared with)
      sent = srv || M.getSave()?.slice() || null;
      let t = 0;
      M.addCoreCallbacks({ saveDataUpdatedCallback: () => { clearTimeout(t); t = setTimeout(upload, 1000); } });
      // a save the server does not have yet (played on this device while offline) goes up now
      // (Gold/Silver: only a real save, not blank or leftover save RAM)
      const local = M.getSave();
      if (srv === null && local?.some((b) => b !== 0xff && b !== 0) && (!G.save || local[G.save.check[0]] === G.save.check[1])) upload(true);
      $('#fadein').classList.add('off');
    })();

    function skipToTitle() {
      const s = PREVIEW_SKIP[id];
      let frames = 0;
      M.setFastForwardMultiplier(8);
      M.addCoreCallbacks({ videoFrameEndedCallback: () => {
        frames++;
        if (frames === s.frames) {
          M.setFastForwardMultiplier(1);
          M.buttonPress(s.button);
          setTimeout(() => {
            M.buttonUnpress(s.button);
            setTimeout(() => parent.postMessage({ previewTitle: id }, location.origin), 400);
            // a still of the title screen for the side slides of the first screen
            setTimeout(() => {
              try {
                const name = `title_${id}.png`;
                if (!M.screenshot(name)) return;
                const png = M.FS.readFile(`${M.filePaths().screenshotsPath}/${name}`);
                const fr = new FileReader();
                fr.onload = () => parent.postMessage({ previewShot: id, png: fr.result }, location.origin);
                fr.readAsDataURL(new Blob([png], { type: 'image/png' }));
              } catch (e) {}
            }, 1500);
          }, 120);
        }
      } });
    }

    async function goHome() {
      if (M) { try { const d = M.getSave(); if (d && d.length) await upload(); } catch (e) {} }
      location.href = './';
    }
    $('#home').addEventListener('click', goHome);
    $('#speed').addEventListener('click', () => M && nextSpeed());
    // the same two on the full-height body (built later, so listen on the document)
    document.addEventListener('click', (e) => {
      const t = e.target.closest && e.target.closest('#homeKey, #speedKey');
      if (!t) return;
      if (t.id === 'homeKey') goHome(); else if (M) nextSpeed();
    });
  </script>
</body>
</html>
